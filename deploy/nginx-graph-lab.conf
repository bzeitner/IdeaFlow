# Isolated static Graph Lab. This origin receives no IdeaFlow cookies and has
# no server-side privileges; it receives short-lived read-only capabilities via
# postMessage from the exact IdeaFlow origin.
server {
    listen 80;
    listen [::]:80;
    server_name graph-lab.bitesoftheweek.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name graph-lab.bitesoftheweek.com;

    ssl_certificate     /etc/ssl/cloudflare/bitesoftheweek.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bitesoftheweek.com.key;

    root /var/www/ideaflow-graph-lab/current;
    index index.html;

    # 'self' is required because the bridge nests /gephi/ in a same-origin
    # iframe; the exact IdeaFlow origin remains the only external parent.
    # Gephi Lite's pinned runtime generates validators with new Function().
    # unsafe-eval is confined to this cookie-free static origin; external
    # scripts remain disallowed and IdeaFlow's CSP is unchanged.
    add_header Content-Security-Policy "default-src 'self' blob:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: https://ideaflow.bitesoftheweek.com; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'self' https://ideaflow.bitesoftheweek.com; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
