# nginx site for IdeaFlow, sitting behind Cloudflare.
# Install to /etc/nginx/sites-available/ideaflow, then:
#   sudo ln -s /etc/nginx/sites-available/ideaflow /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# IdeaFlow is served at the ideaflow.bitesoftheweek.com subdomain.
# TLS here uses a Cloudflare Origin Certificate covering *.bitesoftheweek.com
# (see deploy/README.md). Set the Cloudflare SSL/TLS mode to "Full (strict)".

server {
    listen 80;
    listen [::]:80;
    server_name ideaflow.bitesoftheweek.com;
    return 301 https://$host$request_uri;
}

server {
    # Combined "ssl http2" form works on nginx 1.24 (Ubuntu 24.04) and newer;
    # the standalone "http2 on;" directive is 1.25.1+ only.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ideaflow.bitesoftheweek.com;

    ssl_certificate     /etc/ssl/cloudflare/bitesoftheweek.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bitesoftheweek.com.key;

    # Feeds/ideas are small; keep uploads modest.
    client_max_body_size 10m;

    # WhiteNoise serves /static/ from inside the app, so nginx just proxies
    # everything to gunicorn. Cloudflare caches static by extension at the edge.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
