<form method="get" class="owner-filter">
  <label><span class="sr-only">Search ideas</span><input type="search" name="q" value="{{ q }}" placeholder="Search ideas…"></label>
  <label><span class="sr-only">Filter by owner</span><select name="owner">
    <option value="">All owners</option>
    <option value="mine"{% if owner_filter == 'mine' %} selected{% endif %}>My ideas</option>
    {% for owner in owners %}{% with owner_id=owner.pk|stringformat:"s" %}<option value="{{ owner.pk }}"{% if owner_filter == owner_id %} selected{% endif %}>{{ owner.email|default:owner.username }}</option>{% endwith %}{% endfor %}
  </select></label>
  <button class="btn small" type="submit">Apply</button>
  {% if owner_filter or q %}<a class="btn small" href="{{ request.path }}">Clear</a>{% endif %}
</form>
